<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - gainmap hdr (tsl node)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			.lbl {
				color: #fff;
				font-size: 16px;
				font-weight: bold;
				position: absolute;
				bottom: 0px;
				z-index: 100;
				text-shadow: #000 1px 1px 1px;
				background-color: rgba(0,0,0,0.85);
				padding: 1em;
			}

			#lbl_left {
				text-align:left;
				left:0px;
			}
		</style>
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - gain map (ultra hdr) decoded on the GPU into a TSL texture node <br/>
			Gain map images converted from hdr with <a href="https://gainmap-creator.monogrid.com/" target="_blank" rel="noopener">Gain map converter</a>. <br />
			See external <a href="https://github.com/MONOGRID/gainmap-js" target="_blank" rel="noopener">gainmap-js</a> for more information on how to use and create gain map images.
		</div>

		<div id="lbl_left" class="lbl"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.186.1/build/three.webgpu.js",
					"three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/",
					"three/webgpu": "https://unpkg.com/three@0.186.1/build/three.webgpu.js",
					"three/tsl": "https://unpkg.com/three@0.186.1/build/three.tsl.js",
					"@monogrid/gainmap-js/webgpu": "https://unpkg.com/@monogrid/gainmap-js/dist/decode.webgpu.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { equirectUV, texture } from 'three/tsl';

import Stats from 'three/addons/libs/stats.module.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

			import { GainMapNodeLoader, HDRJPGNodeLoader } from '@monogrid/gainmap-js/webgpu';

			const params = {
				envMap: 'HDR JPG',
				headroom: 1,
				roughness: 0.0,
				metalness: 1.0,
				exposure: 1.0,
				debug: false
			};

			const lbl = document.getElementById( 'lbl_left' );
			const fileSizes = {};
			const resolutions = {};

			const camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 500 );
			camera.position.set( 0, 0, - 120 );

			const scene = new THREE.Scene();

			const renderer = new THREE.WebGPURenderer();
			await renderer.init();
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			document.body.appendChild( renderer.domElement );

			// loaders return TSL texture nodes synchronously, no renderer needed
			const nodes = {
				'HDR JPG': new HDRJPGNodeLoader().load( 'textures/gainmap/spruit_sunrise_4k.jpg', ( hdr ) => onLoad( 'HDR JPG', hdr ), ( p ) => onProgress( 'HDR JPG', p ) ),
				'Webp Gain map (separate)': new GainMapNodeLoader().load( [
					'textures/gainmap/spruit_sunrise_4k.webp',
					'textures/gainmap/spruit_sunrise_4k-gainmap.webp',
					'textures/gainmap/spruit_sunrise_4k.json'
				], ( hdr ) => onLoad( 'Webp Gain map (separate)', hdr ), ( p ) => onProgress( 'Webp Gain map (separate)', p ) )
			};

			// plain .hdr for comparison
			const hdrTexture = new HDRLoader().load( 'textures/gainmap/spruit_sunrise_1k.hdr', () => {

				hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
				resolutions[ 'HDR' ] = hdrTexture.image.width + 'x' + hdrTexture.image.height;
				if ( params.envMap === 'HDR' ) useNode();

			}, ( p ) => onProgress( 'HDR', p ) );
			const hdrNode = texture( hdrTexture );

			// plane: the node used as a color node, only visible in debug
			const planeMaterial = new THREE.MeshBasicNodeMaterial();
			const plane = new THREE.Mesh( new THREE.PlaneGeometry( 200, 200 ), planeMaterial );
			plane.position.y = - 50;
			plane.rotation.x = - Math.PI * 0.5;
			plane.visible = params.debug;
			scene.add( plane );

			// torus: lit by scene.environment, PMREM is regenerated only when the node re-decodes
			const torusMesh = new THREE.Mesh(
				new THREE.TorusKnotGeometry( 18, 8, 200, 40, 1, 3 ),
				new THREE.MeshStandardMaterial( { color: 0xffffff, metalness: params.metalness, roughness: params.roughness } )
			);
			scene.add( torusMesh );

			function useNode() {

				const hdr = params.envMap === 'HDR' ? hdrNode : nodes[ params.envMap ];

				// background: same node, sampled with equirectangular uvs
				scene.backgroundNode = hdr.sample( equirectUV() );

				// the decoded texture, kept up to date because the node is used in the graphs above
				// assigned once loaded: the texture gets its final size on load and PMREMs don't follow resizes
				if ( hdr === hdrNode ? hdrTexture.image : hdr.width > 0 ) {

					hdr.value.mapping = THREE.EquirectangularReflectionMapping;
					scene.environment = hdr.value;

				}

				planeMaterial.colorNode = hdr;
				planeMaterial.needsUpdate = true;

				displayStats();

			}

			function onLoad( name, hdr ) {

				resolutions[ name ] = hdr.width + 'x' + hdr.height;
				// metadata arrives with the image
				updateHeadroom();
				useNode();

			}

			function onProgress( name, progress ) {

				fileSizes[ name ] = humanFileSize( progress.total );
				displayStats();

			}

			function displayStats() {

				const name = params.envMap;
				lbl.innerHTML = name + ' size : ' + ( fileSizes[ name ] ?? '' ) + ', Resolution: ' + ( resolutions[ name ] ?? '' );

			}

			function humanFileSize( bytes, si = true, dp = 1 ) {

				const thresh = si ? 1000 : 1024;

				if ( Math.abs( bytes ) < thresh ) {

					return bytes + ' B';

				}

				const units = si
					? [ 'kB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB' ]
					: [ 'KiB', 'MiB', 'GiB', 'TiB', 'PiB', 'EiB', 'ZiB', 'YiB' ];
				let u = - 1;
				const r = 10 ** dp;

				do {

					bytes /= thresh;
					++ u;

				} while ( Math.round( Math.abs( bytes ) * r ) / r >= thresh && u < units.length - 1 );

				return bytes.toFixed( dp ) + ' ' + units[ u ];

			}

			function updateHeadroom() {

				// the slider works in stops (log2), 1 = the full range of the image
				for ( const hdr of Object.values( nodes ) ) hdr.maxDisplayBoost.value = Math.pow( 2, params.headroom * hdr.hdrCapacityMax.value );

			}

			useNode();

			const stats = new Stats();
			document.body.appendChild( stats.dom );

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.minDistance = 50;
			controls.maxDistance = 300;

			const gui = new GUI();
			gui.add( params, 'envMap', [ ...Object.keys( nodes ), 'HDR' ] ).onChange( useNode );
			// a uniform: the node re-decodes once, only when the value changes
			gui.add( params, 'headroom', 0, 1, 0.01 ).name( 'display headroom' ).onChange( updateHeadroom );
			gui.add( params, 'roughness', 0, 1, 0.01 );
			gui.add( params, 'metalness', 0, 1, 0.01 );
			gui.add( params, 'exposure', 0, 2, 0.01 );
			gui.add( params, 'debug' );
			gui.open();

			window.addEventListener( 'resize', () => {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			} );

			renderer.setAnimationLoop( () => {

				torusMesh.material.roughness = params.roughness;
				torusMesh.material.metalness = params.metalness;
				if ( ! window.TESTING ) torusMesh.rotation.y += 0.005;
				plane.visible = params.debug;
				renderer.toneMappingExposure = params.exposure;
				stats.begin();
				renderer.render( scene, camera );
				stats.end();

			} );

		</script>

	</body>
</html>
